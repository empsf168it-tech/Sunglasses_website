<main class="auth-page"><section class="auth-card"><div class="auth-visual"><img src="https://images.pexels.com/photos/36824973/pexels-photo-36824973.jpeg?auto=compress&cs=tinysrgb&w=2400" alt="Black aviator sunglasses" onerror="this.onerror=null;this.src='assets/sunglasses-fallback.svg'"><div class="auth-copy"><div class="eyebrow" style="color:#d8cfc4">The Solara club</div><h2>Your next<br><em>favourite frame.</em></h2><p>Join for early access to new silhouettes and members-only optical edits.</p></div></div><div class="auth-form"><a class="brand" href="index.html" style="justify-content:center;margin-bottom:20px"><img src="assets/favicon.svg" alt="Solara"><span>SOLARA</span></a><h1>Create account.</h1><p class="muted">It takes less than a minute.</p><form onsubmit="event.preventDefault();alert('Demo account created.');location.href='login.html'"><div class="field"><label>Full name</label><input required placeholder="Your name"></div><div class="field"><label>Email</label><input required type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input required minlength="6" type="password" placeholder="At least 6 characters"></div><button class="btn gold" style="width:100%">Create account →</button></form><p class="switch">Already a member? <a href="login.html">Sign in</a></p><p class="switch"><a href="index.html">← Back to store</a></p></div></section></main></body></html>
